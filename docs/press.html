<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Press Photo — SAJA Project</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />

    <!-- Core theme CSS -->
    <link href="css/styles.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #111;
            color: #fff;
        }

        .about-section {
            padding: 8rem 0 5rem;
            background-color: #111;
        }

        .press-title {
            font-size: 2rem;
            margin-bottom: 3rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .press-photo {
            max-width: 100%;
            width: 900px;
            border-radius: 4px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .press-photo:hover {
            transform: scale(1.01);
            opacity: 0.95;
        }

        .photo-caption {
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
        }

        .bg-black {
            background-color: #111 !important;
        }

        .footer {
            padding: 2rem 0;
        }

        a {
            color: #fff;
            text-decoration: none;
        }

        .navbar {
            background-color: rgba(0,0,0,0.9);
        }

        .nav-link,
        .navbar-brand {
            color: #fff !important;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .navbar-toggler {
            border-color: rgba(255,255,255,0.3);
        }

        .navbar-toggler i {
            color: #fff;
        }
    </style>
</head>

<body id="page-top">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container px-4 px-lg-5">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img
                src="assets/img/Saja_submark_blk on orange_3000x3000px.png"
                alt="SAJA Project"
                style="height: 28px; width: auto;"
            >
        </a>

        <button class="navbar-toggler navbar-toggler-right" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarResponsive">
            Menu <i class="fas fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html#about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html#projects">Works</a>
                </li>

  

                <li class="nav-item">
                    <a class="nav-link" href="index.html#signup">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Press Photo Section -->
<section class="about-section text-center">
    <div class="container px-4 px-lg-5">

        <h1 class="press-title">Press Photos</h1>

        <div class="row justify-content-center g-5">

            <!-- Photo 1 -->
            <div class="col-lg-10">
                <img
                    src="assets/img/SJDunes3.jpeg"
                    alt="SAJA Project Press Photo 1"
                    class="img-fluid press-photo"
                >

                
            </div>

            <!-- Photo 2 -->
            <div class="col-lg-10">
                <img
                    src="assets/img/SJDunes2.jpg"
                    alt="SAJA Project Press Photo 1"
                    class="img-fluid press-photo"
                >

               
            </div>


            <div class="col-lg-10">
                <img
                    src="assets/img/SJDunes1.jpg"
                    alt="SAJA Project Press Photo 1"
                    class="img-fluid press-photo"
                >

                <p class="photo-caption">
                    Photography by Sabine Mignault
                </p>
            </div>

        </div>

    </div>
</section>

<!-- Footer -->
<footer class="footer bg-black small text-center text-white-50">
    <div class="container px-4 px-lg-5">
        Copyright &copy; SAJA 2026
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Core theme JS -->
<script src="js/scripts.js"></script>

</body>
</html>
