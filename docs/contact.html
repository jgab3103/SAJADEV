<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch with SAJA Project for performances, collaborations, press and other enquiries.">
  <title>Contact — SAJA Project</title>
  <link rel="icon" href="assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#151515; --paper:#f4f1eb; --orange:#e99a47; --muted:#746f69; --nav:#26161A; --footer:#0A0908; --line:#d6cec3; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:'Nunito',sans-serif; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--orange); outline-offset:4px; }
    .site-header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px max(24px,calc((100vw - 1160px)/2)); background:var(--nav); color:var(--paper); border-bottom:1px solid #3b342a; }
    .site-header img { display:block; width:52px; height:52px; object-fit:contain; }
    .site-nav { display:flex; gap:26px; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .site-nav a { transition:color .2s ease; }
    .site-nav a:hover,.site-nav a[aria-current="page"] { color:var(--orange); }
    main { width:100%; max-width:1160px; margin:0 auto; padding:0 24px; flex:1; display:flex; align-items:center; }
    .contact { width:100%; padding:90px 0 110px; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0 0 15px; color:#a45e24; font-size:.72rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0 0 27px; font-family:'Varela Round',sans-serif; font-weight:400; font-size:clamp(3.5rem,8vw,6.3rem); line-height:1.1; letter-spacing:-.055em; }
    h1 span { color:var(--orange); }
    .intro { max-width:620px; margin:0 0 38px; font-size:clamp(1.08rem,1.8vw,1.27rem); line-height:1.75; }
    .contact-label { margin:0 0 8px; color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    .email { display:inline-block; max-width:100%; padding-bottom:6px; border-bottom:2px solid var(--orange); font-family:'Varela Round',sans-serif; font-size:clamp(1.3rem,3.5vw,2.15rem); overflow-wrap:anywhere; transition:color .2s ease,border-color .2s ease; }
    .email:hover { color:#ad642e; border-color:#ad642e; }
    .footnote { margin:18px 0 0; font-size:.9rem; color:var(--muted); }
    footer { background:var(--footer); color:var(--paper); text-align:center; padding:26px; font-size:.75rem; }
    @media(max-width:560px) { .site-header { padding:12px 20px; } .site-nav { gap:15px; font-size:.7rem; } main { padding:0 18px; } .contact { padding:70px 0 85px; } }
    @media(prefers-reduced-motion:reduce) { html {scroll-behavior:auto;} .site-nav a,.email {transition:none;} }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" aria-label="SAJA Project home">
      <img src="assets/img/Saja_submark_blk on orange_circle_3000x3000px.png" alt="SAJA Project symbol">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="presskit.html">Press Kit</a>
      <a href="https://saja-music.com/">Saja Music</a>

      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main>
    <section class="contact" aria-labelledby="contact-title">
      <p class="eyebrow">SAJA Project · Get in touch</p>
      <h1 id="contact-title">Contact<span>.</span></h1>
      <p class="intro">For live performances, enquiries, or simply to say hello.</p>
      <p class="contact-label">Email us</p>
      <a class="email" href="mailto:info@sajaproject.com">info@sajaproject.com</a>
      <p class="footnote">Jamie Gabriel &amp; Sally Jamila · Australia / Aotearoa New Zealand</p>
    </section>
  </main>
  <footer>© SAJA 2026 &nbsp;·&nbsp; Photography by Sabine Mignault</footer>
</body>
</html>
